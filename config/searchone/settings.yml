# SearchOne additions. Loaded on top of SearXNG defaults by ./manage-searchone.
use_default_settings: true

search:
  formats:
    - html
    - json

engines:
  - name: tavily
    engine: tavily
    shortcut: tv
    categories: [general]
    timeout: 20.0
    disabled: true
    include_answer: true

  - name: tender
    engine: tender
    shortcut: td
    categories: [general]
    network: tavily
    timeout: 25.0
    disabled: true
    results_per_page: 20
    search_depth: advanced
    default_time_range: month

  - name: exa
    engine: exa
    shortcut: exa
    categories: [general]
    timeout: 20.0
    disabled: true

  - name: metaso
    engine: metaso
    shortcut: ms
    categories: [general]
    timeout: 20.0
    disabled: true

  - name: zhihu
    engine: zhihu
    shortcut: zh
    categories: [social media]
    timeout: 30.0
    disabled: true

  - name: minimax
    engine: minimax
    shortcut: mm
    categories: [general]
    timeout: 20.0
    disabled: true

  - name: zhipu
    engine: zhipu_web_search
    shortcut: zp
    categories: [general]
    timeout: 30.0
    disabled: true
