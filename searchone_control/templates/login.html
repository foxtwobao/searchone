<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · SearchOne</title>
    <link rel="stylesheet" href="{{ url_for('searchone_admin.static', filename='admin.css') }}">
  </head>
  <body class="login-body">
    <main class="login-panel">
      <div class="login-brand"><span class="brand-mark">S</span><span>SearchOne</span></div>
      <h1>管理员登录</h1>
      <p>管理搜索访问凭证与网络出口。</p>
      {% if error %}<div class="form-alert">{{ error }}</div>{% endif %}
      <form method="post" class="login-form">
        <label>用户名<input name="username" autocomplete="username" required autofocus></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="button primary full" type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
