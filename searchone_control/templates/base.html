<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}SearchOne 管理后台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('searchone_admin.static', filename='admin.css') }}">
  </head>
  <body data-page="{{ active_page|default('') }}">
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-layout" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M9 9h12"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m12 11 8-8M15 6l3 3M17 4l3 3"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-network" viewBox="0 0 24 24"><rect width="6" height="6" x="9" y="2" rx="1"/><rect width="6" height="6" x="2" y="16" rx="1"/><rect width="6" height="6" x="16" y="16" rx="1"/><path d="M12 8v4M5 16v-2h14v2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.1 12a11 11 0 0 1 19.8 0 11 11 0 0 1-19.8 0"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-log-out" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-9 4 18 3-9h4"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="{{ url_for('searchone_admin.overview') }}">
          <span class="brand-mark">S</span>
          <span>SearchOne</span>
        </a>
        <nav class="nav-list" aria-label="管理导航">
          <a class="nav-item {% if active_page == 'overview' %}active{% endif %}" href="{{ url_for('searchone_admin.overview') }}"><svg><use href="#i-layout"/></svg><span>概览</span></a>
          <a class="nav-item {% if active_page == 'clients' %}active{% endif %}" href="{{ url_for('searchone_admin.clients_page') }}"><svg><use href="#i-key"/></svg><span>客户端 Key</span></a>
          <a class="nav-item {% if active_page == 'providers' %}active{% endif %}" href="{{ url_for('searchone_admin.providers_page') }}"><svg><use href="#i-shield"/></svg><span>供应商凭证</span></a>
          <a class="nav-item {% if active_page == 'proxies' %}active{% endif %}" href="{{ url_for('searchone_admin.proxies_page') }}"><svg><use href="#i-network"/></svg><span>代理池</span></a>
          <a class="nav-item {% if active_page == 'tender-search' %}active{% endif %}" href="{{ url_for('searchone_admin.tender_search_page') }}"><svg><use href="#i-search"/></svg><span>招投标搜索</span></a>
        </nav>
        <div class="sidebar-foot">
          <a href="/" class="subtle-link">返回搜索首页</a>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" type="button" data-sidebar-toggle title="打开导航"><svg><use href="#i-menu"/></svg></button>
          <div class="topbar-title">
            <h1>{% block page_title %}管理后台{% endblock %}</h1>
            <p>{% block page_description %}{% endblock %}</p>
          </div>
          <div class="admin-account">
            <span class="admin-avatar">{{ admin_username[:1]|upper }}</span>
            <span>{{ admin_username }}</span>
            <form action="{{ url_for('searchone_admin.logout') }}" method="post">
              <button class="icon-button" type="submit" title="退出登录" aria-label="退出登录"><svg><use href="#i-log-out"/></svg></button>
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            </form>
          </div>
        </header>
        <section class="page-content">
          {% block content %}{% endblock %}
        </section>
      </main>
    </div>

    <div class="drawer-backdrop" data-drawer-backdrop hidden></div>
    <div class="toast-region" aria-live="polite" data-toast-region></div>
    <script src="{{ url_for('searchone_admin.static', filename='admin.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
