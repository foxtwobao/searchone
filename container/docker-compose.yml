# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searchone

services:
  searchone:
    container_name: searchone
    image: ${SEARCHONE_IMAGE:-docker.io/foxtwobao/searchone}:${SEARCHONE_VERSION:-latest}
    restart: always
    ports:
      - "${SEARCHONE_HOST:-0.0.0.0}:${SEARCHONE_PORT:-8888}:8888"
    environment:
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      SEARCHONE_PROXY_DIRECT_FALLBACK: ${SEARCHONE_PROXY_DIRECT_FALLBACK:-1}
      SEARCHONE_MASTER_KEY: ${SEARCHONE_MASTER_KEY:-}
      SEARCHONE_SESSION_SECRET: ${SEARCHONE_SESSION_SECRET:-}
      SEARCHONE_ADMIN_USERNAME: ${SEARCHONE_ADMIN_USERNAME:-admin}
      SEARCHONE_ADMIN_PASSWORD: ${SEARCHONE_ADMIN_PASSWORD:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      METASO_API_KEY: ${METASO_API_KEY:-}
      TIKHUB_TOKEN: ${TIKHUB_TOKEN:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ZHIPU_CODING_PLAN_API_KEY: ${ZHIPU_CODING_PLAN_API_KEY:-}
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      - searchone-data:/var/lib/searchone/
    depends_on:
      - valkey
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  valkey:
    container_name: searchone-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  searchone-data:
  valkey-data:
